name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '22.x'

jobs:
  backend:
    name: Backend Build & Test (.NET)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: dotnet restore Portfolio.Tests/Portfolio.Tests.csproj
      
      - name: Build
        run: dotnet build Portfolio.Tests/Portfolio.Tests.csproj -c Release --no-restore
      
      - name: Run tests
        run: dotnet test Portfolio.Tests/Portfolio.Tests.csproj -c Release --no-build --verbosity normal

  frontend:
    name: Frontend Build & Test (Vue/Vite)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'portfolio-site/package-lock.json'
      
      - name: Install dependencies
        working-directory: portfolio-site
        run: npm ci
      
      - name: Run security audit
        working-directory: portfolio-site
        run: npm audit --audit-level=high
      
      - name: Run tests
        working-directory: portfolio-site
        run: npm run test -- --run
      
      - name: Build
        working-directory: portfolio-site
        run: npm run build
      
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
