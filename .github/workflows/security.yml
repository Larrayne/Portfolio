name: Security Scan

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and build .NET tests
        run: |
          dotnet restore Portfolio.Tests/Portfolio.Tests.csproj
          dotnet build Portfolio.Tests/Portfolio.Tests.csproj -c Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Install frontend dependencies
        working-directory: portfolio-site
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: portfolio-site
        run: npm audit --audit-level=high
