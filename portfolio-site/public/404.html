<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Larrayne | Full-Stack Developer</title>
    <script>
      // Redirect unknown paths back to index.html preserving the route.
      // Keeps 1 path segment (/Portfolio) so the base URL is preserved.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
